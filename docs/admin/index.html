<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #fbf7f0;
        color: #6b1e1e;
      }
      .panel {
        border: 1px solid rgba(107, 30, 30, 0.18);
        background: #fff;
        padding: 1rem 1.25rem;
        border-radius: 10px;
        box-shadow: 0 6px 18px rgba(17, 24, 39, 0.05);
        max-width: 560px;
      }
      h1 {
        margin: 0 0 0.35rem;
        font: 700 1.5rem Georgia, "Times New Roman", serif;
      }
      p {
        margin: 0;
        color: #4b5563;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>Admin Panel Disabled</h1>
      <p>Decap CMS has been removed from this admin page. Config files are still present if you want to re-enable it later.</p>
    </main>
  </body>
</html>
